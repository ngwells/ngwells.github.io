<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Modern Landing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: { 'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
</head>
<body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen">
  <div class="glassmorphism p-10 rounded-lg shadow-lg backdrop-blur-lg">
    <div class="text-center">
      <span class="inline-block bg-blue-500 text-white px-4 py-2 rounded-full mb-4">Hello World</span>
      <button id="toggleButton" class="bg-blue-500 text-white px-4 py-2 rounded-full hover:bg-blue-600 transition duration-300">Toggle Text</button>
      <div id="textContainer" class="mt-4 hidden">
        <p class="mt-2">Welcome to our modern landing page!</p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('toggleButton').addEventListener('click', function() {
      var textContainer = document.getElementById('textContainer');
      textContainer.classList.toggle('hidden');
    });
  </script>
</body>

</html>
