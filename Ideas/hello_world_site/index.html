<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Modern Landing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: { 'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
</head>
<body class="bg-gray-900 text-white font-mono">
  <div class="flex items-center justify-center min-h-screen">
    <div class="bg-[#1e1e1e] backdrop-blur-lg rounded-lg p-10 shadow-lg shadow-[#000000]/50">
      <div class="text-center">
        <h1 class="text-4xl font-bold">Hello World</h1>
        <p class="mt-4">Welcome to our modern landing page!</p>
        <div class="mt-6">
          <span class="bg-green-500 text-white px-4 py-2 rounded-full">Active</span>
        </div>
        <button id="toggleButton" class="mt-8 bg-blue-500 text-white px-6 py-3 rounded-full hover:bg-blue-600">
          Toggle Text
        </button>
        <div id="textContainer" class="mt-8 hidden">
          <p>This is some additional text that can be toggled.</p>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('toggleButton').addEventListener('click', function() {
      var textContainer = document.getElementById('textContainer');
      if (textContainer.classList.contains('hidden')) {
        textContainer.classList.remove('hidden');
      } else {
        textContainer.classList.add('hidden');
      }
    });
  </script>
</body>

</html>
